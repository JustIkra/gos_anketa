services:
  backend:
    build:
      target: dev
    volumes:
      - ./src/app:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      - DEBUG=1

  frontend:
    build:
      target: dev
    volumes:
      - ./src/front:/app
      - front_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  front_node_modules:
